<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Website Settings | Lion's Sports Wear</title>

<link rel="stylesheet" href="css/dashboard.css">

</head>

<body>

<div class="main">

    <div class="topbar">
        <h1>⚙ Website Settings</h1>
    </div>

    <div class="card">

        <label>Shop Name</label><br>
        <input type="text" id="shopName"><br><br>

        <label>Phone Number</label><br>
        <input type="text" id="phone"><br><br>

        <label>WhatsApp Number</label><br>
        <input type="text" id="whatsapp"><br><br>

        <label>Instagram Link</label><br>
        <input type="text" id="instagram"><br><br>

        <label>Google Maps Link</label><br>
        <input type="text" id="maps"><br><br>

        <button id="saveSettings">💾 Save Settings</button>

<hr><br>

<h2>🎉 Offer Banner</h2>

<label>Offer Title</label><br>
<input type="text" id="offerTitle"><br><br>

<label>Offer Subtitle</label><br>
<input type="text" id="offerSubtitle"><br><br>

<label>Button Text</label><br>
<input type="text" id="offerButton"><br><br>

<label>
<input type="checkbox" id="offerActive">
 Enable Offer Banner
</label>

<br><br>

<button id="saveOffer">
💾 Save Offer
</button>
        
    </div>

</div>

<script type="module" src="js/settings.js"></script>

</body>

</html>
