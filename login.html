<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login - Lion's Sports Wear</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="auth-container">

    <div class="auth-box">

        <h2>Login</h2>

        <input type="email"
               id="loginEmail"
               placeholder="Email">

        <input type="password"
               id="loginPassword"
               placeholder="Password">

        <button id="loginBtn">
            Login
        </button>

        <p>
            Don't have an account?
            <a href="signup.html">
                Create Account
            </a>
        </p>

    </div>

</div>

</body>
</html>
